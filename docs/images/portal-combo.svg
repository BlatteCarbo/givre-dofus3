<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#0d1117"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="26" font-weight="700" fill="#f0f9ff">Combo Éliotrope : portail, portail, tir à travers</text>
    <text x="40" y="76" font-size="15" fill="#8b949e">L'impact sort du portail de sortie avec le même décalage que lanceur → entrée. +2 % de dégâts par case de réseau.</text>
  </g>
  <g transform="translate(70 120)" stroke="#21262d" stroke-width="1">
    <g fill="#161b22">
      <path d="M0 120 L60 90 L120 120 L60 150 Z"/><path d="M120 120 L180 90 L240 120 L180 150 Z"/>
      <path d="M240 120 L300 90 L360 120 L300 150 Z"/><path d="M360 120 L420 90 L480 120 L420 150 Z"/>
      <path d="M480 120 L540 90 L600 120 L540 150 Z"/><path d="M600 120 L660 90 L720 120 L660 150 Z"/>
      <path d="M720 120 L780 90 L840 120 L780 150 Z"/><path d="M840 120 L900 90 L960 120 L900 150 Z"/>
      <path d="M60 150 L120 120 L180 150 L120 180 Z"/><path d="M180 150 L240 120 L300 150 L240 180 Z"/>
      <path d="M300 150 L360 120 L420 150 L360 180 Z"/><path d="M420 150 L480 120 L540 150 L480 180 Z"/>
      <path d="M540 150 L600 120 L660 150 L600 180 Z"/><path d="M660 150 L720 120 L780 150 L720 180 Z"/>
      <path d="M780 150 L840 120 L900 150 L840 180 Z"/>
    </g>
  </g>
  <g transform="translate(70 120)" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <circle cx="60" cy="120" r="16" fill="#38bdf8"/>
    <text x="60" y="80" font-size="14" fill="#7dd3fc" text-anchor="middle" font-weight="600">Éliotrope</text>
    <ellipse cx="300" cy="120" rx="34" ry="13" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <text x="300" y="80" font-size="14" fill="#7dd3fc" text-anchor="middle" font-weight="600">1 · entrée</text>
    <ellipse cx="720" cy="120" rx="34" ry="13" fill="none" stroke="#d946ef" stroke-width="6"/>
    <text x="720" y="80" font-size="14" fill="#f0abfc" text-anchor="middle" font-weight="600">2 · sortie</text>
    <circle cx="900" cy="120" r="16" fill="#e11d48"/>
    <text x="900" y="80" font-size="14" fill="#fda4af" text-anchor="middle" font-weight="600">Ennemi</text>
    <path d="M76 120 L262 120" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="9 6"/>
    <path d="M300 107 C 420 30, 600 30, 720 107" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="510" y="44" font-size="13" fill="#c4b5fd" text-anchor="middle">réseau : 7 cases → +14 %</text>
    <path d="M756 120 L880 120" stroke="#fda4af" stroke-width="4"/>
    <text x="818" y="146" font-size="13" fill="#fda4af" text-anchor="middle">3 · tir</text>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect x="70" y="320" width="300" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="92" y="350" font-size="14" fill="#8b949e">Tours avec tir via portail</text>
    <text x="92" y="377" font-size="20" font-weight="700" fill="#f0f9ff">2,5 % → 24 %</text>
    <rect x="400" y="320" width="300" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="422" y="350" font-size="14" fill="#8b949e">Dégâts du tour (test, niv. 193)</text>
    <text x="422" y="377" font-size="20" font-weight="700" fill="#f0f9ff">53,0 → 58,3 (+10 %)</text>
    <rect x="730" y="320" width="300" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="752" y="350" font-size="14" fill="#8b949e">Combats réels mesurés</text>
    <text x="752" y="377" font-size="20" font-weight="700" fill="#f0f9ff">21 / 21 gagnés</text>
  </g>
</svg>
